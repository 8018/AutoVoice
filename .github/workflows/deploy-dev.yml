name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      voice_backend:
        description: Online speech backend compiled into gateway
        required: true
        default: omni
        type: choice
        options:
          - classic
          - omni
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

concurrency:
  # Dev and production currently share one host. Serialize both workflows so concurrent SSH/SCP
  # sessions cannot overload sshd or race release activation.
  group: autovoice-shared-deploy-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy dev stack
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      vars.AUTO_DEPLOY_DEV == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_HOST: ${{ vars.DEV_SSH_HOST || '47.94.4.204' }}
      DEPLOY_USER: ${{ vars.DEV_SSH_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.DEV_SSH_PORT || '22' }}
      VOICE_BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.voice_backend || vars.VOICE_BACKEND || 'omni' }}

    steps:
      - name: Require dev for manual deployments
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/dev'
        run: |
          echo "::error::Dev stack can only be deployed manually from dev."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AutoVoiceServer/telemetry-web/package-lock.json
            AutoVoiceServer/skill-manager-web/package-lock.json

      - name: Build embedded Web applications
        run: |
          npm --prefix AutoVoiceServer/telemetry-web ci
          npm --prefix AutoVoiceServer/telemetry-web run build
          npm --prefix AutoVoiceServer/skill-manager-web ci
          npm --prefix AutoVoiceServer/skill-manager-web run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build deployable jars
        working-directory: AutoVoiceServer
        run: ./gradlew :app:bootJar :tts-server:bootJar :skill-manager:bootJar -PvoiceBackend="$VOICE_BACKEND"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "::error::Configure DEV_SSH_PRIVATE_KEY and DEV_SSH_KNOWN_HOSTS in the dev environment."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/autovoice-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/autovoice-ssh/id_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/autovoice-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/autovoice-ssh/id_key" "$RUNNER_TEMP/autovoice-ssh/known_hosts"

      - name: Upload release
        shell: bash
        run: |
          SSH_ARGS=(
            -i "$RUNNER_TEMP/autovoice-ssh/id_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o "UserKnownHostsFile=$RUNNER_TEMP/autovoice-ssh/known_hosts"
          )
          SCP_ARGS=(
            -i "$RUNNER_TEMP/autovoice-ssh/id_key"
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o "UserKnownHostsFile=$RUNNER_TEMP/autovoice-ssh/known_hosts"
          )
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          STAGING_DIR="/opt/autovoice-dev/incoming/$DEPLOY_SHA"

          source AutoVoiceServer/deploy/ssh-retry.sh

          retry_ssh_operation 5 30 "Create dev staging directory" \
            ssh "${SSH_ARGS[@]}" "$TARGET" "install -d -m 700 '$STAGING_DIR'"
          retry_ssh_operation 3 180 "Upload dev release" \
            scp "${SCP_ARGS[@]}" \
              AutoVoiceServer/app/build/libs/app.jar \
              AutoVoiceServer/tts-server/build/libs/tts-server.jar \
              AutoVoiceServer/skill-manager/build/libs/skill-manager.jar \
              AutoVoiceServer/deploy/deploy-release.sh \
              "$TARGET:$STAGING_DIR/"

      - name: Activate release
        shell: bash
        run: |
          SSH_ARGS=(
            -i "$RUNNER_TEMP/autovoice-ssh/id_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o "UserKnownHostsFile=$RUNNER_TEMP/autovoice-ssh/known_hosts"
          )
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          STAGING_DIR="/opt/autovoice-dev/incoming/$DEPLOY_SHA"
          source AutoVoiceServer/deploy/ssh-retry.sh
          # Activation has unknown outcome if the connection drops, so bound it but never replay it.
          retry_ssh_operation 1 300 "Activate dev release" \
            ssh "${SSH_ARGS[@]}" "$TARGET" \
              "VOICE_BACKEND='$VOICE_BACKEND' bash '$STAGING_DIR/deploy-release.sh' 'dev' '$DEPLOY_SHA' '$STAGING_DIR'"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Dev stack deployed"
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Host: \`$DEPLOY_HOST\`"
            echo "- Voice backend: \`$VOICE_BACKEND\`"
            echo "- Services: dev gateway, dev TTS, dev skill manager (8090/8092/8093)"
          } >> "$GITHUB_STEP_SUMMARY"
