name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-fixtures:
    name: Schema fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: npm ci
      - run: npm test

  server-gradle:
    name: Server (${{ matrix.backend }}) tests and coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: classic
            test_args: test :app:bootJar
          - backend: omni
            # Omni is hybrid: DeepSeek handles business intents and Qwen handles explicit chat mode.
            test_args: test -x :app:test :app:bootJar
    defaults:
      run:
        working-directory: AutoVoiceServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify dev deployment isolation
        run: |
          bash -n deploy/init-dev.sh deploy/deploy-release.sh deploy/verify-deploy-workflows.sh
          bash deploy/verify-deploy-workflows.sh
          test "$(grep -c '^SKILL_MANAGER_URL=' deploy/env.example-dev)" -eq 1
          grep -Fqx 'SKILL_MANAGER_URL=http://127.0.0.1:8093' deploy/env.example-dev
          grep -Fq "expected_skill_manager_url='SKILL_MANAGER_URL=http://127.0.0.1:8093'" deploy/deploy-release.sh
      - run: ./gradlew ${{ matrix.test_args }} -PvoiceBackend=${{ matrix.backend }}
      - name: Enforce aggregate server line coverage
        run: node ../shared/verify-jacoco-coverage.mjs 75 .
      - name: Record build artifact digest
        # D13:记录 CI 产物摘要(部署提升同一产物时可比对),不改变既有门禁
        run: |
          sha256sum app/build/libs/app.jar > app.jar.sha256
          echo "=== app.jar digest ==="
          cat app.jar.sha256
      - name: Verify selected speech backend is exclusive
        shell: bash
        run: |
          JAR=app/build/libs/app.jar
          if [[ "${{ matrix.backend }}" == "classic" ]]; then
            jar tf "$JAR" | grep -q 'BOOT-INF/lib/speech-classic.jar'
            ! jar tf "$JAR" | grep -q 'BOOT-INF/lib/speech-qwen-omni.jar'
          else
            jar tf "$JAR" | grep -q 'BOOT-INF/lib/speech-qwen-omni.jar'
            ! jar tf "$JAR" | grep -q 'BOOT-INF/lib/speech-classic.jar'
            jar tf "$JAR" | grep -q 'BOOT-INF/lib/llm.jar'
            # ASR routes each turn to the business LLM or explicit S2S chat domain.
            jar tf "$JAR" | grep -q 'BOOT-INF/lib/asr-gateway.jar'
          fi
      - name: Upload server reports and digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.backend }}-test-and-coverage-reports
          path: |
            AutoVoiceServer/**/build/test-results/test/*.xml
            AutoVoiceServer/**/build/reports/tests/test/**
            AutoVoiceServer/**/build/reports/jacoco/test/**
            AutoVoiceServer/app.jar.sha256

  android-gradle:
    name: Android tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutoVoice
    env:
      # dev 分支及以 dev 为目标的 PR 固定连接 dev；main/生产验收构建固定连接生产。
      AUTOVOICE_APP_ENV: ${{ (github.ref_name == 'dev' || github.base_ref == 'dev') && 'dev' || 'prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package was removed from current SDK repositories.
          # Install only the supported base package; pinned platform/build tools follow below.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: ./gradlew test lint :app:assembleDebug androidUnitTestCoverage -PuseIflytekStub=true
      - name: Verify release build disables cleartext traffic
        run: |
          ./gradlew :app:processReleaseMainManifest -PuseIflytekStub=true
          MERGED=$(find app/build/intermediates/merged_manifest -path "*release*" -name "AndroidManifest.xml" | head -1)
          test -n "$MERGED" || { echo "::error::merged release manifest not found"; exit 1; }
          grep -q 'usesCleartextTraffic="false"' "$MERGED" || { echo "::error::release manifest must disable cleartext traffic"; exit 1; }
      - name: Enforce Android line coverage baselines
        run: |
          node ../shared/verify-jacoco-coverage.mjs 70 \
            voice-core/build/reports/jacoco/test/jacocoTestReport.xml \
            gateway-client/build/reports/jacoco/test/jacocoTestReport.xml
          node ../shared/verify-jacoco-coverage.mjs 25 \
            app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
          node ../shared/verify-jacoco-coverage.mjs 70 \
            adapter-local/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
          node ../shared/verify-jacoco-coverage.mjs 20 \
            adapter-iflytek/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-lint-and-coverage-reports
          path: |
            AutoVoice/**/build/test-results/**/*.xml
            AutoVoice/**/build/reports/tests/**
            AutoVoice/**/build/reports/lint-results-*
            AutoVoice/**/build/reports/jacoco/**

  web:
    name: ${{ matrix.name }} lint, test, coverage and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Telemetry Web
            directory: AutoVoiceServer/telemetry-web
            artifact: telemetry-web-coverage
          - name: Skill Manager Web
            directory: AutoVoiceServer/skill-manager-web
            artifact: skill-manager-web-coverage
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - run: npm run build
      - name: Upload Web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.directory }}/coverage
