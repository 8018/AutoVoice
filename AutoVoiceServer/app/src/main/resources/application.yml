# AutoVoice 云端服务基础配置。
# secrets 全部为 ${VAR:} 空默认占位：本文件不含任何 secret 字面值，
# 无环境变量也能启动（provider 构造不触网，调用时才失败）。
server:
  port: ${AUTOVOICE_PORT:8080}

spring:
  main:
    banner-mode: off

autovoice:
  gateway:
    auth-enabled: ${AUTOVOICE_GATEWAY_AUTH_ENABLED:false}   # 多设备加固 M1；阿里云部署置 true
    # 设备表 {deviceId: token}（JSON 字符串，如 AUTOVOICE_GATEWAY_AUTH_DEVICES={"demo-1":"..."}）：
    # 不在 yml 声明（占位符空串无法绑定 Map）——env 变量按字符串绑定 gateway.auth-devices，
    # 由 Gateway record 解析 JSON（部署实测 Boot 无 String→Map 转换器，见 AppConfig.Gateway）；
    # 未配置/空 → 空表
    max-connections: ${AUTOVOICE_GATEWAY_MAX_CONNECTIONS:32}   # 并发连接上限，超限 close(4001)
  arbitration:
    # 15000：多目的地导航（先去A再去B）LLM 5-7 轮工具循环实测 7-14s，需放宽 hard 上限；
    # 空调/单目的地轮不受影响（秒级收敛，safety 只兜 LLM 卡死/超长）。
    safety-timeout-ms: 15000
    offline-grace-ms: 1500   # LLM 到达后等离线命令结果的宽限期（offline_won 竞速）
  offline:
    enabled: ${AUTOVOICE_OFFLINE_ENABLED:false}   # 阿里云部署置 true；Mac 本地保持 false（老链路）
    asr-fail-wait-ms: 2000   # ASR 失败后等离线结果窗口（asr_failed_fallback 前）
    pool-size: ${AUTOVOICE_OFFLINE_POOL_SIZE:2}   # 引擎池大小（M3）：N 个 worker 各一独立引擎，会话级 sticky，池满快速失败降级
    sdk:
      lib-path: ${AUTOVOICE_OFFLINE_LIB_PATH:}
      resource-dir: ${AUTOVOICE_OFFLINE_RESOURCE_DIR:}
      work-dir: ${AUTOVOICE_OFFLINE_WORK_DIR:}
      fsa-path: ${AUTOVOICE_OFFLINE_FSA_PATH:}
      license-file: ${AUTOVOICE_OFFLINE_LICENSE_FILE:}
  tts:
    # M4 独立服务：网关转发到 tts-server /tts（合成与缓存归 TTS 服务侧；本地需同时起 tts-server）
    remote-url: ${AUTOVOICE_TTS_REMOTE_URL:http://127.0.0.1:8082/tts}
  skill-manager:
    # skill 平台地址（含 http(s) 前缀）；空白 = 平台未接入，MCP 工具不注入（registry 空快照）
    url: ${SKILL_MANAGER_URL:}
    service-token: ${SKILL_SERVICE_TOKEN:}
    poll-ms: ${SKILL_MANAGER_POLL_MS:600000}
  telemetry:
    # 链路数据平台（T3）：默认开；禁用时 recorder=Noop、Controller/Service 不装配。
    # db/audio 默认 ${java.io.tmpdir}（不污染工作目录）；服务器部署用 env 覆盖
    # （AUTOVOICE_TELEMETRY_DB=/opt/autovoice/telemetry/telemetry.db 等，见 spec 部署节）。
    enabled: ${AUTOVOICE_TELEMETRY_ENABLED:true}
    db-path: ${AUTOVOICE_TELEMETRY_DB:${java.io.tmpdir}/autovoice-telemetry/telemetry.db}
    audio-dir: ${AUTOVOICE_TELEMETRY_AUDIO_DIR:${java.io.tmpdir}/autovoice-telemetry/audio}
    retention-days: ${AUTOVOICE_TELEMETRY_RETENTION_DAYS:7}
  providers:
    llm: deepseek        # 语义由 LLM function calling 承担（原 NLU 链路已退役）
    asr: iflytek        # iflytek（在线听写） | aliyun（一句话识别）
    tts: aliyun
  secrets:
    xfyun-appid: ${XFYUN_APPID:}
    xfyun-api-key: ${XFYUN_API_KEY:}
    xfyun-api-secret: ${XFYUN_API_SECRET:}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    aliyun-ak: ${ALIYUN_AK:}
    aliyun-sk: ${ALIYUN_SK:}
    aliyun-nls-appkey: ${ALIYUN_NLS_APPKEY:}
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
