# AutoVoice 云端服务基础配置。
# secrets 全部为 ${VAR:} 空默认占位：本文件不含任何 secret 字面值，
# 无环境变量也能启动（provider 构造不触网，调用时才失败）。
server:
  port: 8080

spring:
  main:
    banner-mode: off

autovoice:
  arbitration:
    safety-timeout-ms: 6500
    offline-grace-ms: 1500   # LLM 到达后等离线命令结果的宽限期（offline_won 竞速）
  offline:
    enabled: ${AUTOVOICE_OFFLINE_ENABLED:false}   # 阿里云部署置 true；Mac 本地保持 false（老链路）
    asr-fail-wait-ms: 2000   # ASR 失败后等离线结果窗口（asr_failed_fallback 前）
    sdk:
      lib-path: ${AUTOVOICE_OFFLINE_LIB_PATH:}
      resource-dir: ${AUTOVOICE_OFFLINE_RESOURCE_DIR:}
      work-dir: ${AUTOVOICE_OFFLINE_WORK_DIR:}
      fsa-path: ${AUTOVOICE_OFFLINE_FSA_PATH:}
      license-file: ${AUTOVOICE_OFFLINE_LICENSE_FILE:}
  tts:
    cache-dir: ${AUTOVOICE_TTS_CACHE_DIR:}   # 空 → 仅内存缓存
  providers:
    llm: deepseek        # 语义由 LLM function calling 承担（原 NLU 链路已退役）
    asr: iflytek        # iflytek（在线听写） | aliyun（一句话识别）
    tts: aliyun
  secrets:
    xfyun-appid: ${XFYUN_APPID:}
    xfyun-api-key: ${XFYUN_API_KEY:}
    xfyun-api-secret: ${XFYUN_API_SECRET:}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    aliyun-ak: ${ALIYUN_AK:}
    aliyun-sk: ${ALIYUN_SK:}
    aliyun-nls-appkey: ${ALIYUN_NLS_APPKEY:}
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
