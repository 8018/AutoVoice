# AutoVoice 云端服务基础配置。
# secrets 全部为 ${VAR:} 空默认占位：本文件不含任何 secret 字面值，
# 无环境变量也能启动（provider 构造不触网，调用时才失败）。
server:
  port: 8080

spring:
  main:
    banner-mode: off

autovoice:
  arbitration:
    nlu-grace-ms: 1500
    safety-timeout-ms: 6500
  providers:
    nlu: iflytek        # iflytek | fake
    llm: deepseek
    asr: aliyun
    tts: aliyun
  secrets:
    xfyun-appid: ${XFYUN_APPID:}
    xfyun-api-key: ${XFYUN_API_KEY:}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    aliyun-ak: ${ALIYUN_AK:}
    aliyun-sk: ${ALIYUN_SK:}
    aliyun-nls-appkey: ${ALIYUN_NLS_APPKEY:}
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
