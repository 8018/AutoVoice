# 生产 profile:身份与管理边界必须显式配置,由 ProductionConfigGuard 在启动期 fail-closed
# 校验(缺失即拒绝启动)。演示/本地开发显式使用 demo-full profile,不启用本校验。
# 部署启用方式:--spring.profiles.active=production(替换 demo-full)。
server:
  # D03c HTTPS/WSS 接入:直连 TLS(密钥库由运维提供)或反向代理终结 TLS 二选一。
  # 直连:置 AUTOVOICE_SSL_ENABLED=true 并配置密钥库;反代:保持 false,由 nginx 等
  # 终结 TLS 并转发 ws://127.0.0.1:8080(客户端用 wss://域名)。见 deploy/README.md。
  ssl:
    enabled: ${AUTOVOICE_SSL_ENABLED:false}
    key-store: ${AUTOVOICE_SSL_KEYSTORE:}
    key-store-password: ${AUTOVOICE_SSL_KEYSTORE_PASSWORD:}
    key-store-type: ${AUTOVOICE_SSL_KEYSTORE_TYPE:PKCS12}
autovoice:
  gateway:
    # 生产必须 true,且配置非空设备表;两者都缺/任一缺失 → 启动失败
    auth-enabled: ${AUTOVOICE_GATEWAY_AUTH_ENABLED:false}
  telemetry:
    # 遥测采集/查询边界令牌,生产必须非空(D03a:access=设备上传,admin=管理员查询)
    access-token: ${AUTOVOICE_TELEMETRY_ACCESS_TOKEN:}
    admin-token: ${AUTOVOICE_TELEMETRY_ADMIN_TOKEN:}
