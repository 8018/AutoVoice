# demo-full profile：完整云端 demo 配置（端口 8080，WS 端点 /ws）。
# secrets 从环境变量注入（XFYUN_APPID / XFYUN_API_KEY / XFYUN_API_SECRET /
# DEEPSEEK_API_KEY / DASHSCOPE_API_KEY；ALIYUN_* 仅 asr=aliyun 时需要）。
server:
  port: 8080
autovoice:
  arbitration:
    safety-timeout-ms: 6500
    offline-grace-ms: 1500   # LLM 到达后等离线命令结果的宽限期（offline_won 竞速）
  offline:
    # 服务器 .env 设 AUTOVOICE_OFFLINE_ENABLED=true 开启（未设时与旧链路一致）
    enabled: ${AUTOVOICE_OFFLINE_ENABLED:false}
    asr-fail-wait-ms: 2000   # ASR 失败后等离线结果窗口（asr_failed_fallback 前）
    sdk:
      lib-path: /opt/autovoice/iflytek-offline/libautovoice_offline_esr.so
      resource-dir: /opt/autovoice/iflytek-offline/resource
      work-dir: /opt/autovoice/iflytek-offline/work
      fsa-path: /opt/autovoice/iflytek-offline/cn_fsa.txt
      license-file: ${AUTOVOICE_OFFLINE_LICENSE_FILE:}   # 空 → 联网激活（authType=0）
  tts:
    cache-dir: /opt/autovoice/tts-cache   # 磁盘持久缓存（cache HIT 秒回）
  providers:
    llm: deepseek       # 语义由 LLM function calling 承担（原 NLU 链路已退役）
    asr: iflytek        # iflytek（在线听写） | aliyun（一句话识别）
    tts: aliyun
  secrets:
    xfyun-appid: ${XFYUN_APPID:}
    xfyun-api-key: ${XFYUN_API_KEY:}
    xfyun-api-secret: ${XFYUN_API_SECRET:}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    aliyun-ak: ${ALIYUN_AK:}
    aliyun-sk: ${ALIYUN_SK:}
    aliyun-nls-appkey: ${ALIYUN_NLS_APPKEY:}
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
